[project]
name = "importance-aware-nbr"
version = "0.1.0"
description = "Importance-Aware Next Basket Recommendation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "einops>=0.6.0",
    "lightning>=2.2.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.15.0",
    "loguru>=0.7.0",
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "faiss-cpu>=1.8.0",
    "gensim>=4.3.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nbr*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
