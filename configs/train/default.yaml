# Training config
lr: 1.0e-3
batch_size: 256
epochs: 30
warmup_steps: 1000
weight_decay: 1.0e-4
dropout: 0.1
max_seq_len: 10       # max number of historical baskets
num_workers: 4
grad_clip: 1.0
accumulate_grad_batches: 1
log_every_n_steps: 50
save_top_k: 1
monitor_metric: val/loss
monitor_mode: min
wandb_project: importance-aware-nbr
run_name: null
k_values: [5, 10, 20]
loss_weights:
  lambda: 1.0         # BCE loss weight
  gamma: 0.5          # importance init loss weight
  eta: 0.3            # MLM loss weight
  orth: 0.1           # orthogonality loss weight
