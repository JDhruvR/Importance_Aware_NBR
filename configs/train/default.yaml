# Training config
lr: 1.0e-3
batch_size: 256
epochs: 30
warmup_steps: 1000
weight_decay: 1.0e-4
dropout: 0.1
max_seq_len: 10       # max number of historical baskets
loss_weights:
  lambda: 1.0         # BCE loss weight
  gamma: 0.5          # importance init loss weight
  eta: 0.3            # MLM loss weight
  orth: 0.1           # orthogonality loss weight
