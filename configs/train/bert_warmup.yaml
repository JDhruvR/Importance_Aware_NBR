# BERT MLM warmup config
lr: 1.2e-3
batch_size: 256
epochs: 24
warmup_steps: 1000
min_lr_ratio: 0.02
weight_decay: 4.0e-3
dropout: 0.22
num_workers: 8
grad_clip: 1.0
accumulate_grad_batches: 1
log_every_n_steps: 50
save_top_k: 1
monitor_metric: val/mlm_loss
monitor_mode: min
wandb_project: importance-aware-nbr
run_name: null

mask_prob: 0.15
val_mask_prob: 0.15
max_items_per_basket: null
max_train_baskets: null
max_val_baskets: null

use_word2vec_init: true
word2vec_path: null

run_sanity_checks: true
sanity_max_baskets: 2000

early_stop_patience: 4
early_stop_min_delta: 0.0005
label_smoothing: 0.03
