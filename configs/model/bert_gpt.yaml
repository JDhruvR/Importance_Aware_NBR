# BERT-GPT model config (warmup + joint training)
model_type: bert_gpt
D: 128          # embedding / hidden dimension
L1: 2           # intra-basket encoder layers
L2: 2           # inter-basket GPT layers
K1: 4           # number of attention heads (intra-basket)
K2: 4           # number of attention heads (inter-basket)
num_heads: 4    # Default fallback for models referencing num_heads generally

# Optional: Path to pretrained BERT warmup bundle to initialize embedding and encoder
pretrained_bert_path: null
item_id_offset: 2
